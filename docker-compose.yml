services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridaudit
      POSTGRES_USER: gridaudit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente ou ficheiro .env local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gridaudit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridaudit -d gridaudit"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  gridaudit_pgdata:
