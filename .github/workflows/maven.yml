name: CI Backend e Frontend

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend-spring-boot/pom.xml
      - name: Compilar e executar testes do backend
        run: mvn -B verify --file backend-spring-boot/pom.xml
      - name: Testar arranque, login e resumo da API
        env:
          SPRING_PROFILES_ACTIVE: demo
          EDM_GENSERICO_PASSWORD: ci-genserico-test-password
          EDM_OXIDIA_PASSWORD: ci-oxidia-test-password
          EDM_LEYSA_PASSWORD: ci-leysa-test-password
          EDM_HELEN_PASSWORD: ci-helen-test-password
          JWT_SECRET: ci-only-generated-test-key-with-at-least-32-bytes
        run: |
          java -jar backend-spring-boot/target/energy-theft-detection-1.0.0.jar > /tmp/edm-backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --max-time 2 --output /dev/null http://localhost:8080/api/auth/me; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/edm-backend.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/edm-backend.log
            exit 1
          fi
          python3 - <<'PY'
          import json
          import urllib.request
          base = "http://localhost:8080"
          data = json.dumps({"username": "genserico", "password": "ci-genserico-test-password"}).encode()
          req = urllib.request.Request(base + "/api/auth/login", data=data, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as response:
              login = json.load(response)
          assert login["authenticated"] is True and login["token"], "Login não devolveu token"
          req = urllib.request.Request(base + "/api/energy/summary", headers={"Authorization": "Bearer " + login["token"]})
          with urllib.request.urlopen(req, timeout=15) as response:
              summary = json.load(response)
          assert isinstance(summary, dict) and summary, "Resumo da API vazio"
          transformer_req = urllib.request.Request(base + "/api/energy/transformers", headers={"Authorization": "Bearer " + login["token"]})
          with urllib.request.urlopen(transformer_req, timeout=15) as response:
              transformers = json.load(response)
          assert transformers, "Não foram carregados transformadores"
          original = transformers[0]
          tid = original["transformerId"]
          before = original["totalSuppliedKwh"]
          payload = json.dumps({"clandestineKwh": 2400}).encode()
          req = urllib.request.Request(base + f"/api/energy/transformers/{tid}/simulate-theft", data=payload, headers={"Content-Type": "application/json", "Authorization": "Bearer " + login["token"]}, method="POST")
          with urllib.request.urlopen(req, timeout=15) as response:
              simulated = json.load(response)
          assert abs(simulated["totalSuppliedKwh"] - before - 2400) < 0.02, "Simulação não actualizou energia fornecida"
          req = urllib.request.Request(base + f"/api/energy/transformers/{tid}/normalize", data=b"{}", headers={"Content-Type": "application/json", "Authorization": "Bearer " + login["token"]}, method="POST")
          with urllib.request.urlopen(req, timeout=15) as response:
              normalized = json.load(response)
          assert normalized["lossPercentage"] <= 5.0, "Regularização não reduziu perdas ao limiar esperado"
          req = urllib.request.Request(base + f"/api/energy/transformers/{tid}/details", headers={"Authorization": "Bearer " + login["token"]})
          with urllib.request.urlopen(req, timeout=15) as response:
              details = json.load(response)
          assert isinstance(details["meters"], list), "Detalhe dos contadores indisponível"
          print("Smoke test: login, resumo, simulação, regularização e detalhes OK")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar tipagem e gerar build
        run: npm run build
