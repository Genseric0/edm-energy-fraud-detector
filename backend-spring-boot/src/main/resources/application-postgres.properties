# Activar com SPRING_PROFILES_ACTIVE=postgres. Nunca guardar passwords neste ficheiro.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gridaudit}
spring.datasource.username=${DB_USERNAME:gridaudit}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway é o único responsável por alterações de esquema no PostgreSQL.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
