# Activar com SPRING_PROFILES_ACTIVE=postgres. Nunca guardar passwords neste ficheiro.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gridaudit}
spring.datasource.username=${DB_USERNAME:gridaudit}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Política transitória para o protótipo: actualizar esquema sem apagar dados.
# Antes de produção, substituir por migrações versionadas e validate.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
