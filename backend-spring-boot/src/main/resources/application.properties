# ===================================================================
# Configurações do Sistema de Detecção de Perdas Não Técnicas
# ===================================================================
server.port=8080

# Configurações do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:energydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Acesse em: http://localhost:8080/h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS e JSON
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===================================================================
# Configuração JWT (autenticação stateless via token)
# ===================================================================
# Chave secreta usada para assinar os tokens (HS256 exige >= 256 bits / 32 bytes).
# Em produção, isto DEVE vir de uma variável de ambiente, nunca hardcoded.
app.security.jwt.secret=${JWT_SECRET}
# Expiração do token: 8 horas (suficiente para uma sessão de trabalho ou apresentação)
app.security.jwt.expiration-ms=28800000
